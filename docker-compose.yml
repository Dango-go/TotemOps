services:
  postgres:
    image: postgres:16-alpine
    container_name: totemops-postgres
    restart: always
    environment:
      POSTGRES_USER: totem
      POSTGRES_PASSWORD: totem_secret_password
      POSTGRES_DB: totemops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totem -d totemops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
