apiVersion: apps/v1
kind: Deployment
metadata:
  name: eta
  labels:
    app.kubernetes.io/name: eta
    app.kubernetes.io/part-of: totemops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eta
        app.kubernetes.io/part-of: totemops
    spec:
      containers:
      - name: eta
        image: harbor.totemops.internal/totemops/eta:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8007
          protocol: TCP
        env:
        - name: PORT
          value: "8007"
        - name: ENVIRONMENT
          value: "production"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
