apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: totem-prod

resources:
  - ../../base/identity
  - ../../base/catalog
  - ../../base/pricing
  - ../../base/cart
  - ../../base/inventory
  - ../../base/payment
  - ../../base/eta
  - ../../base/geo-tracking
  - ../../base/dispatch
  - ../../base/fraud
  - ../../base/notification
  - ../../base/review
  - ../../base/analytics-sink
  - ../../base/order
  - ../../base/bff-merchant
  - ../../base/bff-courier
  - ../../base/bff-customer

commonLabels:
  environment: prod
  app.kubernetes.io/managed-by: argocd

images:
  - name: identity
    newTag: "v1.0.0"
  - name: catalog
    newTag: "v1.0.0"
  - name: pricing
    newTag: "v1.0.0"
  - name: cart
    newTag: "v1.0.0"
  - name: inventory
    newTag: "v1.0.0"
  - name: payment
    newTag: "v1.0.0"
  - name: eta
    newTag: "v1.0.0"
  - name: geo-tracking
    newTag: "v1.0.0"
  - name: dispatch
    newTag: "v1.0.0"
  - name: fraud
    newTag: "v1.0.0"
  - name: notification
    newTag: "v1.0.0"
  - name: review
    newTag: "v1.0.0"
  - name: analytics-sink
    newTag: "v1.0.0"
  - name: order
    newTag: "v1.0.0"
  - name: bff-merchant
    newTag: "v1.0.0"
  - name: bff-courier
    newTag: "v1.0.0"
  - name: bff-customer
    newTag: "v1.0.0"
