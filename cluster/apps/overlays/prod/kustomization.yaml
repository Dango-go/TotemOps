    newTag: "v1.0.0"
  - name: harbor.totemops.internal/totemops/eta
    newTag: "v1.0.0"
  - name: harbor.totemops.internal/totemops/geo-tracking
    newTag: "v1.0.0"
  - name: harbor.totemops.internal/totemops/dispatch
    newTag: "v1.0.0"
  - name: harbor.totemops.internal/totemops/fraud
    newTag: "v1.0.0"
