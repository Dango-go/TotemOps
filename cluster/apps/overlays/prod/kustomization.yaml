apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: totem-prod

resources:
  - ../../base/identity
  - ../../base/catalog
  - ../../base/pricing
  - ../../base/cart
  - ../../base/inventory
  - ../../base/payment
  - ../../base/eta
  - ../../base/geo-tracking
  - ../../base/dispatch
  - ../../base/fraud
  - ../../base/notification
  - ../../base/review
  - ../../base/analytics-sink
  - ../../base/order
  - ../../base/bff-merchant
  - ../../base/bff-courier
  - ../../base/bff-customer

commonLabels:
  environment: prod
  app.kubernetes.io/managed-by: argocd

images:
