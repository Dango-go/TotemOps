apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app

resources:
- ../../base/identity
- ../../base/catalog
- ../../base/pricing
- ../../base/cart
- ../../base/inventory
- ../../base/payment
- ../../base/eta
- ../../base/geo-tracking
- ../../base/dispatch
- ../../base/fraud
- ../../base/notification
- ../../base/review
- ../../base/analytics-sink
- ../../base/order
- ../../base/bff-merchant
- ../../base/bff-courier
- ../../base/bff-customer

commonLabels:
  app.kubernetes.io/managed-by: argocd
  environment: stage

images:
- name: analytics-sink
  newTag: latest
- name: bff-courier
  newTag: latest
- name: bff-customer
  newTag: latest
- name: bff-merchant
  newTag: latest
- name: cart
  newTag: latest
- name: catalog
  newTag: latest
- name: dispatch
  newTag: latest
- name: eta
  newTag: latest
- name: fraud
  newTag: latest
- name: geo-tracking
  newTag: latest
- name: identity
  newTag: latest
- name: inventory
  newTag: latest
- name: notification
  newTag: latest
- name: order
  newName: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/order
  newTag: "42"
- name: payment
  newTag: latest
- name: pricing
  newTag: latest
- name: review
  newTag: latest
