apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: totemops-apps
  namespace: argocd
spec:
  description: "Project "

  sourceRepos:
    - 'https://github.com/Dango-go/TotemOps'
  destinations:
    - namespace: app
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  clusterResourceBlacklist:
    - group: "*"
      kind: "ClusterRole"
    - group: "*"
      kind: "ClusterRoleBinding"
    - group: "*"
      kind: "CustomResourceDefinition"